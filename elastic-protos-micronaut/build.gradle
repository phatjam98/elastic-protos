plugins {
    id 'elastic-protos.library-conventions'
}

description = 'Micronaut integration for elastic-protos: configuration, bean factories and startup index bootstrap'

dependencies {
    api project(':elastic-protos-core')

    // compileOnly: every Micronaut 4 application already provides the Micronaut runtime, at the
    // versions of its own platform. Publishing micronaut-inject/-context (or the platform) would
    // either force our platform onto the app or lift only these two modules and skew micronaut-core.
    // So the published POM/module carry no Micronaut dependency at all.
    compileOnly platform(libs.micronaut.platform)
    compileOnly libs.micronaut.inject
    compileOnly libs.micronaut.context
    annotationProcessor platform(libs.micronaut.platform)
    annotationProcessor libs.micronaut.annotation.processor

    // Either adapter may be on the application classpath; beans are conditional on which one is.
    compileOnly project(':elastic-protos-elasticsearch')
    compileOnly project(':elastic-protos-opensearch')

    testAnnotationProcessor platform(libs.micronaut.platform)
    testAnnotationProcessor libs.micronaut.annotation.processor
}

testing.suites.test {
    dependencies {
        implementation platform(libs.micronaut.platform)
        implementation libs.micronaut.inject
        implementation libs.micronaut.context
        implementation libs.micronaut.test.spock
        // Compiles the Groovy test beans (@Factory, @Replaces, listeners).
        implementation libs.micronaut.inject.groovy
        implementation project(':elastic-protos-testkit')
        implementation project(':elastic-protos-elasticsearch')
        implementation project(':elastic-protos-opensearch')
        // Captures log events in BootstrapSpec.
        implementation libs.logback.classic
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

// Coverage counts our classes only, not the $...Definition classes Micronaut generates.
afterEvaluate {
    tasks.withType(JacocoReportBase).configureEach {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/$*'])
        }))
    }
}
