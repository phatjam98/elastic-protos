version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Micronaut 4 is the supported line; a Micronaut 5 module (Java 25) is planned separately.
      - dependency-name: 'io.micronaut*'
        update-types: ['version-update:semver-major']
      # protobuf stays on the 3.25 line: generated code loads on 3.25+ and 4.x runtimes, and Micronaut 4
      # consumers are pinned to 3.25 by the Micronaut platform BOM (see CLAUDE.md).
      - dependency-name: 'com.google.protobuf:protobuf-java'
        update-types: ['version-update:semver-major']
      - dependency-name: 'com.google.protobuf:protobuf-java-util'
        update-types: ['version-update:semver-major']
      - dependency-name: 'com.google.protobuf:protoc'
        update-types: ['version-update:semver-major']
    groups:
      gradle-plugins:
        patterns:
          - 'org.jreleaser*'
          - 'com.google.protobuf:protobuf-gradle-plugin'
          - 'org.gradle.toolchains.foojay-resolver-convention*'
          - 'com.puppycrawl.tools:checkstyle'
          - 'org.jacoco*'
      micronaut:
        patterns:
          - 'io.micronaut*'
      protobuf:
        patterns:
          - 'com.google.protobuf*'
      test:
        patterns:
          - 'org.spockframework*'
          - 'org.junit*'
          - 'org.testcontainers*'
          - 'org.opensearch:opensearch-testcontainers'
          - 'org.apache.groovy*'
      all-other:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
