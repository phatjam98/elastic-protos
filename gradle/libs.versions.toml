# Single source of truth for dependency versions. buildSrc imports this catalog too.
[versions]
# protobuf stays on the 3.25 line: generated code from 3.25 loads on 3.25+ and 4.x runtimes,
# and Micronaut 4 consumers are pinned to 3.25 by the Micronaut platform BOM.
protobuf = "3.25.9"
protobuf-plugin = "0.10.0"
es-rest-client = "9.5.5"
os-rest-client = "3.9.0"
jackson = "2.22.4"
slf4j = "2.0.20"
logback = "1.6.6"
groovy = "4.0.33"
spock = "2.5-groovy-4.0"
junit = "5.14.4"
testcontainers = "2.0.5"
os-testcontainers = "4.1.0"
micronaut-platform = "5.2.5"
jreleaser = "1.27.0"
jacoco = "0.8.16"
checkstyle = "12.3.1"

[libraries]
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf-plugin" }
es-rest-client = { module = "org.elasticsearch.client:elasticsearch-rest-client", version.ref = "es-rest-client" }
os-rest-client = { module = "org.opensearch.client:opensearch-rest-client", version.ref = "os-rest-client" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
spock-bom = { module = "org.spockframework:spock-bom", version.ref = "spock" }
spock-core = { module = "org.spockframework:spock-core" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-elasticsearch = { module = "org.testcontainers:testcontainers-elasticsearch", version.ref = "testcontainers" }
testcontainers-spock = { module = "org.testcontainers:testcontainers-spock", version.ref = "testcontainers" }
os-testcontainers = { module = "org.opensearch:opensearch-testcontainers", version.ref = "os-testcontainers" }
micronaut-platform = { module = "io.micronaut.platform:micronaut-platform", version.ref = "micronaut-platform" }
micronaut-inject = { module = "io.micronaut:micronaut-inject" }
micronaut-context = { module = "io.micronaut:micronaut-context" }
micronaut-annotation-processor = { module = "io.micronaut:micronaut-inject-java" }
micronaut-test-spock = { module = "io.micronaut.test:micronaut-test-spock" }
micronaut-inject-groovy = { module = "io.micronaut:micronaut-inject-groovy" }

[plugins]
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
