name: Snapshot

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  checks: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read project version
        id: version
        run: |
          VERSION=$(./gradlew properties -q | awk '/^version:/ {print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is a SNAPSHOT; it will be published"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is not a SNAPSHOT; skipping snapshot publishing"
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: publish snapshot
    needs: [ check, ci ]
    if: needs.check.outputs.is_snapshot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          passphrase: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}

      - name: Stage all modules
        run: ./gradlew stageAll

      # Deploy only: snapshots go to the Central snapshots repository and never create a GitHub release.
      - name: Deploy snapshot with JReleaser
        run: ./gradlew jreleaserDeploy
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
          JRELEASER_NEXUS2_USERNAME: ${{ secrets.JRELEASER_NEXUS2_USERNAME }}
          JRELEASER_NEXUS2_PASSWORD: ${{ secrets.JRELEASER_NEXUS2_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}

      - name: Upload JReleaser logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-snapshot-logs
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties
          if-no-files-found: ignore
