pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Downloads the Java 17 toolchain when none is installed locally.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// A standalone build: it is not part of the elastic-protos root build and consumes the
// published artifacts, exactly as an application would.
rootProject.name = 'micronaut-sample'
