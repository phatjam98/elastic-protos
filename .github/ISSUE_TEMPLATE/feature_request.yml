name: Feature request
description: Suggest a new capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. A proto option, an API sketch or an example query helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now (MappingOverrides, raw_mapping_json, editing the compiled body, ...).
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Mapping / proto options
        - Migrations
        - Document codec
        - Query DSL
        - Engine adapters
        - Micronaut
        - Build / release
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself (see CONTRIBUTING.md)
