syntax = "proto3";

package phatjam98.elasticprotos.example;

import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "phatjam98/elasticprotos/v1/elastic_options.proto";
import "phatjam98/elasticprotos/v1/geo.proto";

option java_package = "com.phatjam98.elasticprotos.proto.example";
option java_multiple_files = true;
option java_outer_classname = "TypedMapsProtos";

// Maps whose keys take the value type: type OBJECT turns each map into a dynamic object with
// dynamic templates, so counters.views is a long, notes.summary analyzed text and so on.
message TypedMaps {
  option (phatjam98.elasticprotos.v1.elastic) = { alias: "typed_maps" };

  string id = 1 [(phatjam98.elasticprotos.v1.elastic_field).id = TRUE];
  // counters.<key> => long
  map<string, int64> counters = 2 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
  // notes.<key> => text (english) with a .keyword sub-field, searched by FULL_TEXT as notes.*
  map<string, string> notes = 3 [(phatjam98.elasticprotos.v1.elastic_field) = {
    type: OBJECT
    value_type: TEXT
    analyzer: "english"
    full_text: TRUE
  }];
  // due.<key> => date
  map<string, google.protobuf.Timestamp> due = 4 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
  // levels.<key> => keyword holding the enum name
  map<string, TypedMapLevel> levels = 5 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
  // places.<key> => geo_point
  map<string, phatjam98.elasticprotos.v1.LatLon> places = 6 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
  // children.<key> => object with name, count, label and nested items
  map<string, TypedChild> children = 7 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
  // bags.<key> => object whose tags map is flattened, as a map anywhere else
  map<string, TypedBag> bags = 8 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
  // the default: flattened
  map<string, string> labels = 9;
  // attributes.<key> => flattened, as a Struct anywhere else
  map<string, google.protobuf.Struct> attributes = 10 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
}

enum TypedMapLevel {
  TYPED_MAP_LEVEL_UNSPECIFIED = 0;
  LOW = 1;
  HIGH = 2;
}

message TypedChild {
  string name = 1;
  int64 count = 2;
  repeated TypedItem items = 3;
  string display_name = 4 [(phatjam98.elasticprotos.v1.elastic_field).name = "label"];
  string secret = 5 [(phatjam98.elasticprotos.v1.elastic_field).type = IGNORE];
}

message TypedItem {
  string sku = 1;
  int32 quantity = 2;
}

message TypedBag {
  map<string, string> tags = 1;
}

// Maps inside the values of typed maps (ADR 0011): the value message keeps typed leaves, and each
// inner field follows the rule it would follow anywhere else.
message InnerMaps {
  option (phatjam98.elasticprotos.v1.elastic) = { alias: "inner_maps" };

  string id = 1 [(phatjam98.elasticprotos.v1.elastic_field).id = TRUE];
  // outer.<key> => object of InnerValue
  map<string, InnerValue> outer = 2 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
  // nested_outer.<key> => nested InnerPart, whose counts map is typed
  map<string, InnerPart> nested_outer = 3 [(phatjam98.elasticprotos.v1.elastic_field) = {
    type: OBJECT
    value_type: NESTED
  }];
}

message InnerValue {
  double score = 1;
  // outer.<key>.labels => flattened, the default for a map
  map<string, string> labels = 2;
  // outer.<key>.metrics.<key> => double
  map<string, double> metrics = 3 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
  // outer.<key>.parts.<key> => object with qty, at, where and counts.<key>
  map<string, InnerPart> parts = 4 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
  // outer.<key>.extra => flattened, as a Struct anywhere else
  google.protobuf.Struct extra = 5;
  // outer.<key>.payload => disabled object, kept in _source
  google.protobuf.Any payload = 6;
  // outer.<key>.mask => disabled object; a FieldMask prints as a string
  google.protobuf.FieldMask mask = 7;
}

message InnerPart {
  int64 qty = 1;
  google.protobuf.Timestamp at = 2;
  phatjam98.elasticprotos.v1.LatLon where = 3;
  // <part>.counts.<key> => long
  map<string, int64> counts = 4 [(phatjam98.elasticprotos.v1.elastic_field).type = OBJECT];
}
