plugins {
    id 'base'
    alias(libs.plugins.jreleaser)
}

description = 'Protobuf-driven index mappings, migrations and queries for Elasticsearch and OpenSearch'

jreleaser {
    configFile = file('jreleaser.yml')
}

// Modules that publish to Maven Central. The testkit stays internal.
def publishedModules = [
        'elastic-protos-core',
        'elastic-protos-elasticsearch',
        'elastic-protos-opensearch',
        'elastic-protos-micronaut',
        'elastic-protos-bom',
]

def stagingDir = layout.buildDirectory.dir('staging-deploy')

// stageAll starts from an empty directory so artifacts staged for an earlier version never ride
// along into a release. The publish convention orders every staging publish after this task.
def cleanStagingDeploy = tasks.register('cleanStagingDeploy', Delete) {
    group = 'publishing'
    description = 'Deletes build/staging-deploy.'
    delete stagingDir
}

def stageAll = tasks.register('stageAll') {
    group = 'publishing'
    description = 'Cleans build/staging-deploy, then publishes every module into it for JReleaser.'
    dependsOn cleanStagingDeploy
    dependsOn publishedModules.collect { ":${it}:publishAllPublicationsToStagingRepository" }
}

// Consumers must not inherit a platform (BOM) from us: a platform dependency in apiElements or
// runtimeElements of the Gradle module metadata, or an import-scoped BOM in a POM, forces its
// versions onto every consumer's classpath. Only our own BOM may be imported. Deliberately not
// part of `check`, so `build` has no staging side effects; CI's stage job runs
// `stageAll verifyPublishedMetadata` on every PR.
def verifyPublishedMetadata = tasks.register('verifyPublishedMetadata') {
    group = 'verification'
    description = 'Fails when a staged .module exports a platform or a staged POM imports a foreign BOM.'
    dependsOn stageAll
    def dir = stagingDir
    doLast {
        def root = dir.get().asFile
        def problems = []
        def modules = 0
        def poms = 0
        root.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            def rel = root.toPath().relativize(file.toPath()).toString()
            if (file.name.endsWith('.module')) {
                modules++
                def json = new groovy.json.JsonSlurper().parse(file)
                json.variants.findAll { it.name in ['apiElements', 'runtimeElements'] }.each { variant ->
                    variant.dependencies?.each { dep ->
                        if (dep.attributes?.get('org.gradle.category') == 'platform') {
                            problems << "${rel}: ${variant.name} exports platform ${dep.group}:${dep.module}"
                        }
                    }
                }
            } else if (file.name.endsWith('.pom')) {
                poms++
                def pom = new groovy.xml.XmlSlurper().parse(file)
                pom.dependencyManagement.dependencies.dependency.each { dep ->
                    if (dep.scope.text() == 'import'
                            && !(dep.groupId.text() == 'com.phatjam98' && dep.artifactId.text() == 'elastic-protos-bom')) {
                        problems << "${rel}: imports BOM ${dep.groupId.text()}:${dep.artifactId.text()}"
                    }
                }
                pom.dependencies.dependency.each { dep ->
                    if (dep.version.text().trim().isEmpty()) {
                        problems << "${rel}: dependency ${dep.groupId.text()}:${dep.artifactId.text()} has no version"
                    }
                }
            }
        }
        if (modules == 0 || poms == 0) {
            throw new GradleException("verifyPublishedMetadata: nothing staged in ${root}")
        }
        if (!problems.isEmpty()) {
            throw new GradleException('Published metadata exports dependency management to consumers:\n  '
                    + problems.join('\n  '))
        }
        logger.lifecycle("verifyPublishedMetadata: ${modules} .module and ${poms} .pom files export no platform or foreign BOM")
    }
}

tasks.named('jreleaserFullRelease') {
    dependsOn 'stageAll'
}

tasks.register('showVersion') {
    group = 'help'
    description = 'Prints the project version.'
    def v = version
    doLast { println "elastic-protos version: ${v}" }
}
