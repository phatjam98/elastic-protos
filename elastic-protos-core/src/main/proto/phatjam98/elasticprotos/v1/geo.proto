syntax = "proto3";

package phatjam98.elasticprotos.v1;

option java_package = "com.phatjam98.elasticprotos.proto";
option java_multiple_files = true;
option java_outer_classname = "GeoProtos";

// A WGS84 coordinate. As a document field it maps to geo_point by default.
message LatLon {
  double lat = 1;
  double lon = 2;
}

// A geometry expressed as WKT or GeoJSON. Exactly one of the two should be set.
// As a document field it maps to geo_shape by default.
message GeoShape {
  string wkt = 1;
  string geojson = 2;
}
