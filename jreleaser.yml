# JReleaser configuration for elastic-protos.
#
# Gradle stages every published module into build/staging-deploy (./gradlew stageAll), and JReleaser
# signs and deploys from there:
#   - SNAPSHOT versions: `./gradlew jreleaserDeploy` -> nexus2 snapshot-deploy (Central snapshots repo)
#   - release versions:  `./gradlew jreleaserFullRelease` -> mavenCentral release-deploy + GitHub release
# Credentials and the signing key come from JRELEASER_* environment variables, never from this file.
project:
  name: elastic-protos
  description: Protobuf-driven index mappings, migrations and queries for Elasticsearch and OpenSearch
  longDescription: |
    elastic-protos turns Protocol Buffer message definitions into Elasticsearch and OpenSearch index
    mappings, keeps indices in step as the protos evolve, and searches them with a proto-defined query DSL.

    Features:
    - Engine-agnostic core with adapters for Elasticsearch 8.x/9.x and OpenSearch 2.x/3.x, built on the
      official low-level REST clients
    - Index mappings driven by proto field and message options, with programmatic overrides
    - Hash-versioned indices with automatic PUT_MAPPING or REINDEX migrations behind a stable alias
    - Protobuf <-> JSON document codec
    - Proto query DSL compiled to search requests, including full-text search
    - Optional Micronaut 4 module with configuration, bean factories and startup bootstrap
  links:
    homepage: https://github.com/phatjam98/elastic-protos
    documentation: https://github.com/phatjam98/elastic-protos#readme
    bugTracker: https://github.com/phatjam98/elastic-protos/issues
  authors:
    - Travis Carter
  license: Apache-2.0
  inceptionYear: 2024
  stereotype: NONE
  languages:
    java:
      groupId: com.phatjam98
      version: 17
      multiProject: true

release:
  github:
    enabled: true
    skipRelease: false
    host: github.com
    owner: phatjam98
    name: elastic-protos
    tagName: 'v{{projectVersion}}'
    releaseName: 'elastic-protos {{projectVersion}}'
    branch: main
    branchPush: main
    overwrite: false
    draft: false
    prerelease:
      pattern: '.*-(SNAPSHOT|alpha|beta|rc|RC|M).*'
      enabled: true
    issues:
      enabled: true
    milestone:
      close: false
    changelog:
      enabled: true
      formatted: ALWAYS
      preset: conventional-commits
      skipMergeCommits: true
      # Labels come from the conventional-commits preset labelers (one per commit type). Commits with
      # these labels are dropped from the changelog; dependabot uses build(deps) / ci(deps).
      excludeLabels:
        - merge
        - chore
        - ci
        - docs
        - build
        - test
      hide:
        categories:
          - merge
          - tasks
          - build
          - docs
          - test
        contributors:
          - '[bot]'
          - 'GitHub'
          - 'dependabot'

signing:
  pgp:
    # Key material comes from JRELEASER_GPG_PUBLIC_KEY / JRELEASER_GPG_SECRET_KEY / JRELEASER_GPG_PASSPHRASE.
    active: ALWAYS
    armored: true
    verify: true
    mode: MEMORY

deploy:
  maven:
    pomchecker:
      # version omitted: JReleaser 1.27 uses its bundled default (PomChecker 1.15.0)
      failOnError: true
      failOnWarning: false
    mavenCentral:
      release-deploy:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - build/staging-deploy
        applyMavenCentralRules: true
        retryDelay: 60
        maxRetries: 120
        connectTimeout: 20
        readTimeout: 60
        checksums: true
        sourceJar: true
        javadocJar: true
    nexus2:
      snapshot-deploy:
        active: SNAPSHOT
        url: https://central.sonatype.com/repository/maven-snapshots/
        snapshotUrl: https://central.sonatype.com/repository/maven-snapshots/
        stagingRepositories:
          - build/staging-deploy
        applyMavenCentralRules: true
        snapshotSupported: true
        closeRepository: true
        releaseRepository: true

announce:
  enabled: false
