// Base conventions for every Java module: toolchain, Spock test suites, JaCoCo, Checkstyle, Javadoc.
import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    id 'java-library'
    id 'groovy'
    id 'jacoco'
    id 'checkstyle'
    id 'jvm-test-suite'
}

def libs = extensions.getByType(VersionCatalogsExtension).named('libs')

group = 'com.phatjam98'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing', '-Xlint:-serial'])
}

tasks.withType(GroovyCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation libs.findLibrary('slf4j-api').get()
}

// Generated protobuf code is excluded from style, coverage and javadoc.
def generatedPackage = 'com/phatjam98/elasticprotos/proto/**'

testing {
    suites {
        configureEach {
            useSpock(libs.findVersion('spock').get().requiredVersion)
            dependencies {
                implementation libs.findLibrary('groovy').get()
                runtimeOnly platform(libs.findLibrary('junit-bom').get())
                runtimeOnly libs.findLibrary('junit-platform-launcher').get()
                runtimeOnly libs.findLibrary('logback-classic').get()
            }
            targets.configureEach {
                testTask.configure {
                    // Compilation always targets 17; -PtestJavaVersion=21 runs the tests on a newer JDK.
                    def testJava = providers.gradleProperty('testJavaVersion').map { Integer.parseInt(it) }.getOrElse(17)
                    javaLauncher = javaToolchains.launcherFor {
                        languageVersion = JavaLanguageVersion.of(testJava)
                    }
                    systemProperty 'updateGolden', providers.gradleProperty('updateGolden').getOrElse('false')
                    testLogging {
                        events TestLogEvent.FAILED, TestLogEvent.SKIPPED
                        exceptionFormat = TestExceptionFormat.FULL
                        showExceptions = true
                        showCauses = true
                        showStackTraces = true
                    }
                }
            }
        }

        // Docker-backed tests live in src/integrationTest and never run from `./gradlew test`.
        integrationTest(JvmTestSuite) {
            dependencies {
                implementation project()
            }
            targets.configureEach {
                testTask.configure {
                    shouldRunAfter(tasks.named('test'))
                    systemProperty 'elasticprotos.engineImage', providers.gradleProperty('engineImage').getOrElse('')
                    // EngineIntegrationSpec is skipped without Docker; -PrequireDocker=true (CI) makes it
                    // run regardless, so a missing Docker fails the suite instead of passing it vacuously.
                    systemProperty 'elasticprotos.requireDocker', providers.gradleProperty('requireDocker').getOrElse('false')
                }
            }
        }
    }
}

// -PprotobufRuntimeVersion=4.x.y runs the unit tests against another protobuf-java runtime while
// compiling against (and generating code with) the catalog's 3.25 line, to prove that 3.25 gencode
// loads on 4.x. Only the test runtime classpath changes. The Micronaut module is excluded to stay
// on the Micronaut-managed protobuf line. The `test` task gets the version as the system property
// elasticprotos.protobufRuntime, which ProtobufRuntimeSpec (core) checks against the loaded runtime.
def protobufRuntimeVersion = providers.gradleProperty('protobufRuntimeVersion')
if (protobufRuntimeVersion.isPresent() && project.name != 'elastic-protos-micronaut') {
    def runtimeVersion = protobufRuntimeVersion.get()
    tasks.named('test', Test) {
        systemProperty 'elasticprotos.protobufRuntime', runtimeVersion
    }
    configurations.named('testRuntimeClasspath') {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.google.protobuf'
                    && details.requested.name in ['protobuf-java', 'protobuf-java-util']) {
                details.useVersion(runtimeVersion)
                details.because('-PprotobufRuntimeVersion: test generated 3.25 code on another runtime')
            }
        }
    }
}

jacoco {
    toolVersion = libs.findVersion('jacoco').get().requiredVersion
}

afterEvaluate {
    tasks.withType(JacocoReportBase).configureEach {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [generatedPackage])
        }))
    }
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

checkstyle {
    toolVersion = libs.findVersion('checkstyle').get().requiredVersion
    configDirectory = rootProject.layout.projectDirectory.dir('config/checkstyle')
    configFile = rootProject.file('config/checkstyle/google_checks.xml')
    configProperties = [
            'org.checkstyle.google.suppressionfilter.config':
                    rootProject.file('config/checkstyle/checkstyle-suppressions.xml').absolutePath,
    ]
    ignoreFailures = false
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    exclude generatedPackage
}

tasks.named('javadoc', Javadoc) {
    exclude generatedPackage
    options {
        encoding = 'UTF-8'
        addBooleanOption('html5', true)
        addStringOption('Xdoclint:all,-missing', '-quiet')
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification'), tasks.named('javadoc')
}
