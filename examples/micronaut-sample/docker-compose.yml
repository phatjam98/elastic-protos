# Single-node development clusters for the sample, security disabled. Both listen on 9200, so
# start one at a time:
#   docker compose --profile elasticsearch up -d
#   docker compose --profile opensearch up -d
# and stop with `docker compose --profile <name> down` (add -v to drop the data volume).
name: elastic-protos-sample

services:
  elasticsearch:
    profiles: [ elasticsearch ]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  opensearch:
    profiles: [ opensearch ]
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  es-data:
  os-data:
