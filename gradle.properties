# All modules are versioned in lockstep. Releases override this with -Pversion=X.Y.Z (the release
# workflow derives it from the tag and passes it on every Gradle call); the git tag itself does not.
version=1.0.0-SNAPSHOT

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
